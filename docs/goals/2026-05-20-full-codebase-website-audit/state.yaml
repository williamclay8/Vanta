    allowed_files:
      - "docs/goals/2026-05-20-full-codebase-website-audit/goal.md"
      - "docs/goals/2026-05-20-full-codebase-website-audit/state.yaml"
    verify:
      - "git status --short --branch"
      - "git diff --name-status"

  - id: T002
    type: scout
    assignee: Scout
    status: complete
    objective: "Audit protocol/security risks in the dirty tree and validate Claude findings H3/H4/M4/M5."
    allowed_files: []

  - id: T003
    type: scout
    assignee: Scout
    status: complete
    objective: "Evaluate Grok/Claude kanban and audit artifacts against current repo evidence."
    allowed_files: []

  - id: T004
    type: scout
    assignee: Scout
    status: complete
    objective: "Audit website/app shell for beta-truth, broken routes, runtime hazards, and UI issues."
    allowed_files: []

  - id: T005
    type: scout
    assignee: Scout
    status: complete
    objective: "Map targeted verification, CI/deploy proof, and proof-packet requirements."
    allowed_files: []

  - id: T006
    type: worker
    assignee: PM
    status: complete
    objective: "Implement the highest-leverage safe local fixes selected after Scout integration."
    allowed_files: []
