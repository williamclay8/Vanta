    - "npm run build"
    - "npm run public:audit-discovery-check"
    - "npm run solana:helius-rpc-config-check"
    - "npm run public:manifesto-check"
    - "npm run security:limitations-check"
    - "npm run audit:package-check"
    - "npm run privacy-audit:tracker-check"
    - "npm run frontend:operator-env-exposure-check"
    - "npm run truth:privacy-claim-gate"
    - "npm run private-pool-v2:tag6-full-predeploy-checklist -- --json"
    - "npm run private-pool-v2:sbf-abi-check"
    - "npm run private-pool-v2:crucible-check"
    - "cargo test --manifest-path programs/vanta_private_pool_v2_spend/Cargo.toml"
    - "git diff --check"
    - "git diff --cached --check"
