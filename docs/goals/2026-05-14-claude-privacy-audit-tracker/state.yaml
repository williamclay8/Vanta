  pushed: "codex/vanta-zk-review-hardening is the publishing branch; check git refs for the exact pushed head."
  deployed_live: "latest circuit/tracker slices are not-live-verified unless a later public website receipt says otherwise"

audit_findings:
  - id: N1
    severity: critical
    title: "Private Pool v2 Shield output_commitment is unconstrained"
    status: local-implemented
    lane: circuits
    files:
      - "zk/noir/vanta_private_pool_v2_shield_entry/src/main.nr"
      - "src/privacy/privatePoolV2ShieldCircuitFixture.ts"
      - "scripts/write-vanta-private-pool-v2-shield-fixture.mjs"
      - "scripts/check-vanta-circuit-soundness-lint.mjs"
    required_fix: "Bind output_commitment to owner/asset/amount/blinding/derivation data, and add invalid-preimage fixtures."
    delivered:
      - "Shield circuit now recomputes output_commitment from owner_commitment, target_asset_id, amount, output_blinding, and output_derivation_tag."
      - "Shield fixture writer/check now includes invalid-output-commitment-preimage and restores a valid Prover.toml."
      - "Circuit soundness lint requires the Shield output commitment preimage relation."
    verify:
      - "npm run zk:circuit-soundness-lint"
      - "npm run private-pool-v2:shield-circuit-check"
      - "npm run private-pool-v2:shield-proof-request-check"
      - "npm run private-pool-v2:public-input-hash-alignment-check"

  - id: N2
    severity: critical
    title: "Owner secret/input commitment binding missing across spend lanes"
    status: partial-local-implemented
    lane: circuits
    files:
      - "zk/noir/vanta_private_pool_v2_send_entry/src/main.nr"
      - "zk/noir/vanta_private_pool_v2_claim_entry/src/main.nr"
      - "zk/noir/vanta_private_pool_v2_swap_to_shielded_entry/src/main.nr"
      - "zk/noir/vanta_private_pool_v2_actual_private_spend_entry/src/main.nr"
      - "zk/noir/vanta_private_core_single_note_send/src/main.nr"
      - "zk/noir/vanta_private_core_single_note_swap/src/main.nr"
    required_fix: "Constrain owner_secret/proof-owner fields to owner_commitment and input commitment preimages using the existing owner-key/canonical-note pattern; keep Private Core Unshield marked already-bound."
    delivered:
      - "Private Pool v2 Send now recomputes owner_commitment from owner_secret and input_commitment from owner_commitment, asset_id_commitment, input_amount, input_blinding, and input_derivation_tag."
      - "Send circuit check now includes invalid-owner-secret-binding and invalid-input-commitment-preimage fixtures."
      - "Send witness-input, browser-worker, proof-artifact, operator-no-witness, public-input-hash, and send-prove paths were updated and verified for the new witness ABI."
      - "Private Pool v2 Claim now recomputes owner_commitment from owner_secret and input_commitment from owner_commitment, asset_id, amount, input_blinding, and input_derivation_tag."
      - "Claim circuit check now includes invalid-owner-secret-binding and invalid-input-commitment-preimage fixtures."
      - "Claim browser-worker, proof-artifact, operator-no-witness, proof-request, and TypeScript paths were updated and verified for the new witness ABI."
      - "Private Pool v2 Swap-to-shielded now recomputes owner_commitment from owner_secret."
      - "Swap-to-shielded circuit check now includes invalid-owner-secret-binding while leaving input-commitment preimage design explicitly open."
      - "Private Pool v2 actual-private-spend now recomputes input_commitment from note_secret, pool_id, asset_cohort, input_blinding, and input_derivation_tag."
      - "Actual-private-spend circuit check now includes invalid-input-commitment-preimage fixtures and the witness/browser/proof paths carry the new note-preimage fields."
    remaining:
      - "Private Pool v2 Swap-to-shielded explicit input-preimage design."
      - "Private Core Send/Swap sender authorization key-model decision."
    completion_guard:
      status_must_remain: "partial-local-implemented"
      hard_blockers:
        - "N2 is not complete while Private Pool v2 Swap-to-shielded lacks a documented canonical input commitment preimage, in-circuit recomputation, and invalid-input-commitment-preimage fixture."
        - "N2 is not complete while Private Core Send/Swap use x25519-secret-prechecked-off-circuit owner authorization; a nonzero sender_secret_key assertion is not sender authorization."
      forbidden_completion_claim:
        - "Do not mark N2 complete based only on owner_secret -> owner_commitment binding in Swap-to-shielded."
        - "Do not mark N2 complete based only on keeping Private Core sender_secret_key live/nonzero."
    remaining_design_blockers:
      - id: N2-PPV2-SWAP-INPUT-PREIMAGE
        status: blocked-architecture-decision
        evidence_refs:
          - "zk/noir/vanta_private_pool_v2_swap_to_shielded_entry/src/main.nr exposes opaque settlement_commitment, route_commitment, and economics_commitment but no raw input asset/amount/economics preimage."
          - "docs/goals/2026-05-14-claude-privacy-audit-tracker/notes/2026-05-14-n2-design-blockers.md"
        decision_required: "Choose the canonical raw input/economic preimage for swap-to-shielded input_commitment before adding an in-circuit assertion."
        not_safe_to_complete_without: "A fixture that makes a forged swap input preimage fail and a documented ABI update for the prover/browser/operator witness paths."
      - id: N2-PRIVATE-CORE-SENDER-AUTH
        status: blocked-architecture-decision
        evidence_refs:
          - "zk/noir/vanta_private_core_single_note_send/src/main.nr keeps sender_secret_key live/nonzero with owner authorization prechecked off-circuit."
          - "zk/noir/vanta_private_core_single_note_swap/src/main.nr keeps sender_secret_key live/nonzero with owner authorization prechecked off-circuit."
          - "src/zk/vantaPrivateCoreSendProof.ts and src/zk/vantaPrivateCoreSwapProof.ts label the current model x25519-secret-prechecked-off-circuit."
          - "docs/goals/2026-05-14-claude-privacy-audit-tracker/notes/2026-05-14-n2-design-blockers.md"
        decision_required: "Choose whether Private Core keeps X25519 owner-public-key notes with off-circuit precheck, adds a separate Poseidon proof-owner key, or migrates note ownership to an in-circuit-friendly key model."
        not_safe_to_complete_without: "A key-model decision, updated proof metadata, invalid-owner-auth fixtures for Send and Swap, and updated private-core verification commands."
    verify:
      - "npm run zk:circuit-soundness-lint"
      - "npm run private-pool-v2:send-circuit-check"
      - "npm run private-pool-v2:send-witness-prover-check"
      - "npm run private-pool-v2:browser-worker-prover-check"
      - "npm run private-pool-v2:send-proof-artifact-consistency-check"
      - "npm run private-pool-v2:send-operator-no-witness-check"
      - "npm run private-pool-v2:send-prove"
      - "npm run private-pool-v2:claim-circuit-check"
      - "npm run private-pool-v2:claim-proof-request-check"
      - "npm run private-pool-v2:claim-browser-worker-prover-check"
      - "npm run private-pool-v2:claim-proof-artifact-consistency-check"
      - "npm run private-pool-v2:claim-operator-no-witness-check"
      - "npm run private-pool-v2:claim-prove"
      - "npm run private-pool-v2:swap-to-shielded-circuit-check"
      - "npm run private-pool-v2:swap-to-shielded-proof-request-check"
      - "npm run private-pool-v2:swap-to-shielded-browser-worker-prover-check"
      - "npm run private-pool-v2:swap-to-shielded-proof-artifact-consistency-check"
      - "npm run private-pool-v2:swap-to-shielded-operator-no-witness-check"
      - "npm run private-pool-v2:swap-to-shielded-prove"
      - "npm run private-pool-v2:actual-private-spend-circuit-check"
      - "npm run private-pool-v2:actual-private-spend-witness-prover-check"
      - "npm run private-pool-v2:actual-private-spend-browser-worker-prover-check"
      - "npm run private-pool-v2:actual-private-spend-proof-artifact-consistency-check"
      - "npm run private-pool-v2:actual-private-spend-operator-no-witness-check"
      - "npm run private-pool-v2:actual-private-spend-prove"
      - "npm run private-core:send-check"
