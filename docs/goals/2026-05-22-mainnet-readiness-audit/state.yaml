new_findings:
  high:
    - id: "H6"
      title: "ActualPrivateSpend circuit does not decompose context_hash"
      file: "zk/noir/vanta_private_pool_v2_actual_private_spend_entry/src/main.nr:78-113,115-171"
      risk: "off-circuit context_hash construction is unconstrained; once C01 verifier wires in, an off-circuit substitution by a relayer cannot be detected on-chain"
      fix_shape: "take (merchant_hi, merchant_lo, denomination, settlement_epoch) as private inputs, recompute context_hash in-circuit, assert equality; add fixture invalid-context-hash-preimage"
      blocks_phase_1_if_ceremony_not_started: true
  medium:
    - id: "M7"
      title: "TAG_REGISTER_VAULT_ASSET not idempotent across param changes"
      file: "programs/vanta_private_pool_v2_spend/src/lib.rs:848-920, 1082-1180"
      risk: "after verifier wires in, accidental re-registration silently moves vault authority binding"
      fix_shape: "explicit ERR_VAULT_ASSET_ALREADY_REGISTERED_WITH_DIFFERENT_PARAMS before any state write"
    - id: "M8"
      title: "operator services return raw err.message"
      file: "operator/private-pool-v2-service-network.mjs:1678,1970,+~12 others"
      risk: "internal-Bearer-authed today; reconnaissance vector if exposed externally"
      fix_shape: "sanitized response strings; structured server-side logging only"
    - id: "M9"
      title: "missing HTTP security headers on live site"
      observation: "X-Content-Type-Options: nosniff present; CSP, HSTS, Referrer-Policy, Permissions-Policy missing"
      fix_shape: "add via Cloudflare or Render response headers per AUDIT_2026-05-22_findings.md"
    - id: "M10"
      title: "CI does not gate build or privacy aggregates"
      file: ".github/workflows/privacy-audit.yml"
      fix_shape: "add verify job running npm ci && npm run build && npm run truth:privacy-claim-gate && npm run zk:review-guards-check"
  low:
    - id: "L6"
      title: "TAG_REGISTER_PROVENANCED_ROOT accepts previous_root == accepted_root"
      file: "programs/vanta_private_pool_v2_spend/src/lib.rs:729-803"
      fix_shape: "if accepted_root == previous_root return Err(ERR_ROOT_TRANSITION_NOOP)"
    - id: "L7"
      title: "Output Record PDA seed is index-based, not content-based"
      file: "programs/vanta_private_pool_v2_spend/src/lib.rs:1556-1630"
      fix_shape: "explanatory comment only; existing init-or-match check is sound"
    - id: "L8"
      title: "service-network lacks CORS/rate-limit"
      file: "operator/private-pool-v2-service-network.mjs"
      fix_shape: "add when role is exposed externally; not urgent today"
    - id: "L9"
      title: "VantaPay privacy gates static-config"
      file: "src/pay/vantaPayTypes.ts:133-135"
      fix_shape: "add runtime guard that throws if production-privacy requested while flag is locked"
    - id: "L10"
