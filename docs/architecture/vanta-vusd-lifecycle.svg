<svg width="1600" height="1020" viewBox="0 0 1600 1020" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#06111C"/>
    </linearGradient>
    <linearGradient id="shieldFlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8EB9FF"/>
      <stop offset="1" stop-color="#59D6BF"/>
    </linearGradient>
    <linearGradient id="sendFlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9DB7FF"/>
      <stop offset="1" stop-color="#7EF0CB"/>
    </linearGradient>
    <linearGradient id="unshieldFlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8AC9FF"/>
      <stop offset="1" stop-color="#9EE7A1"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#8EB9FF"/>
    </marker>
    <marker id="returnHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#9EE7A1"/>
    </marker>
    <style>
      .title { font: 700 42px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #F8FAFC; letter-spacing: -0.03em; }
      .subtitle { font: 600 22px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #C7D6F8; }
      .panel { fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.09); stroke-width: 1.2; }
      .panel-title { font: 700 25px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #F8FAFC; }
      .panel-label { font: 600 13px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #9FB3D9; letter-spacing: 0.12em; text-transform: uppercase; }
      .body { font: 500 15px 'Segoe UI', sans-serif; fill: #D6E2F3; }
      .muted { font: 500 13px 'Segoe UI', sans-serif; fill: #94A3B8; }
      .bullet { font: 500 15px 'Segoe UI', sans-serif; fill: #DDE7F4; }
      .chip { font: 700 12px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #0B1220; }
      .strip-title { font: 700 18px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #F8FAFC; }
      .strip-bullet { font: 500 14px 'Segoe UI', sans-serif; fill: #D8E1F0; }
      .flow-label { font: 700 15px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #CFE0FF; }
      .step { font: 700 13px 'Space Grotesk', 'Segoe UI', sans-serif; fill: #EAF2FF; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="url(#bg)"/>
  <rect x="56" y="48" width="1488" height="924" rx="34" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)"/>

  <text x="86" y="110" class="title">Vanta: constrained real devnet lifecycle for VUSD</text>
  <text x="86" y="152" class="subtitle">Public Wallet -&gt; Shield -&gt; Shielded State -&gt; Send -&gt; Unshield</text>

  <rect x="86" y="198" width="328" height="430" rx="28" class="panel" filter="url(#softShadow)"/>
  <rect x="444" y="198" width="328" height="430" rx="28" class="panel" filter="url(#softShadow)"/>
  <rect x="802" y="198" width="328" height="430" rx="28" class="panel" filter="url(#softShadow)"/>
  <rect x="1160" y="198" width="354" height="430" rx="28" class="panel" filter="url(#softShadow)"/>

  <text x="116" y="242" class="panel-label">Column 1</text>
  <text x="116" y="278" class="panel-title">Public Wallet</text>
  <text x="116" y="304" class="body">Devnet wallet / VUSD source state</text>
  <rect x="116" y="336" width="86" height="86" rx="24" fill="rgba(142,185,255,0.12)" stroke="rgba(142,185,255,0.35)"/>
  <rect x="134" y="356" width="50" height="36" rx="12" fill="none" stroke="#CFE0FF" stroke-width="2"/>
  <path d="M150 356V344C150 336.82 155.82 331 163 331C170.18 331 176 336.82 176 344V356" stroke="#CFE0FF" stroke-width="2" stroke-linecap="round"/>
  <rect x="222" y="344" width="160" height="30" rx="15" fill="url(#shieldFlow)"/>
  <text x="244" y="364" class="chip">Connected wallet</text>
  <text x="222" y="406" class="body">VUSD balance visible in public state.</text>
  <text x="222" y="432" class="muted">Phantom / wallet-standard compatible</text>
  <text x="116" y="482" class="bullet">- live wallet connection</text>
  <text x="116" y="512" class="bullet">- live VUSD balance detection</text>
  <text x="116" y="542" class="bullet">- source state for Shield</text>

  <text x="474" y="242" class="panel-label">Column 2</text>
  <text x="474" y="278" class="panel-title">Vanta Shielded State</text>
  <text x="474" y="304" class="body">Note-based constrained state</text>
  <rect x="486" y="346" width="146" height="84" rx="20" fill="rgba(142,185,255,0.11)" stroke="rgba(142,185,255,0.34)"/>
  <text x="510" y="378" class="step">Shield note</text>
  <text x="510" y="404" class="muted">deposit-backed entry into Vanta</text>
  <rect x="530" y="392" width="146" height="84" rx="20" fill="rgba(89,214,191,0.10)" stroke="rgba(89,214,191,0.34)"/>
  <text x="554" y="424" class="step">Spendable note</text>
  <text x="554" y="450" class="muted">resolved from current note set</text>
  <rect x="574" y="438" width="146" height="84" rx="20" fill="rgba(126,240,203,0.08)" stroke="rgba(126,240,203,0.28)"/>
  <text x="598" y="470" class="step">Change-derived note</text>
  <text x="598" y="496" class="muted">appears after partial Send</text>
  <text x="474" y="548" class="bullet">- onchain shield notes</text>
  <text x="474" y="578" class="bullet">- explicit note identity</text>
  <text x="474" y="608" class="bullet">- spendable note set</text>
  <text x="474" y="638" class="bullet">- shielded balance resolved from current state</text>

  <text x="832" y="242" class="panel-label">Column 3</text>
  <text x="832" y="278" class="panel-title">State Evolution</text>
  <text x="832" y="304" class="body">Constrained Send transitions</text>
  <rect x="838" y="348" width="104" height="60" rx="18" fill="rgba(142,185,255,0.11)" stroke="rgba(142,185,255,0.30)"/>
  <text x="857" y="384" class="step">Input note</text>
  <path d="M944 378H990" stroke="url(#sendFlow)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <rect x="998" y="348" width="108" height="60" rx="18" fill="rgba(157,183,255,0.11)" stroke="rgba(157,183,255,0.30)"/>
  <text x="1030" y="384" class="step">Send</text>
  <path d="M1052 410V454" stroke="url(#sendFlow)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <rect x="980" y="462" width="144" height="60" rx="18" fill="rgba(126,240,203,0.09)" stroke="rgba(126,240,203,0.28)"/>
  <text x="1004" y="498" class="step">Optional change note</text>
  <text x="832" y="548" class="bullet">- note consumption</text>
  <text x="832" y="578" class="bullet">- spent-marker semantics</text>
  <text x="832" y="608" class="bullet">- residual change-note evolution</text>
  <text x="832" y="638" class="bullet">- spendable state updates after Send</text>

  <text x="1190" y="242" class="panel-label">Column 4</text>
  <text x="1190" y="278" class="panel-title">Operator-backed Unshield</text>
  <text x="1190" y="304" class="body">Authenticated, verified exit</text>
  <rect x="1190" y="342" width="294" height="62" rx="18" fill="rgba(142,185,255,0.10)" stroke="rgba(142,185,255,0.28)"/>
  <text x="1212" y="367" class="step">Step 1</text>
  <text x="1212" y="390" class="body">Wallet-authenticated Unshield intent</text>
  <rect x="1190" y="420" width="294" height="82" rx="18" fill="rgba(89,214,191,0.10)" stroke="rgba(89,214,191,0.28)"/>
  <text x="1212" y="445" class="step">Step 2</text>
  <text x="1212" y="468" class="body">Operator verifies referenced</text>
  <text x="1212" y="491" class="body">onchain transition state</text>
  <rect x="1190" y="518" width="294" height="62" rx="18" fill="rgba(158,231,161,0.10)" stroke="rgba(158,231,161,0.30)"/>
  <text x="1212" y="543" class="step">Step 3</text>
  <text x="1212" y="566" class="body">VUSD returned to Public Wallet</text>
  <text x="1190" y="608" class="bullet">- signed wallet intent</text>
  <text x="1190" y="638" class="bullet">- operator verifies referenced onchain transition state</text>
  <text x="1190" y="668" class="bullet">- persistent release records</text>
  <text x="1190" y="698" class="bullet">- VUSD returned to Public Wallet</text>

  <path d="M414 402H444" stroke="url(#shieldFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <text x="420" y="388" class="flow-label">Shield</text>

  <path d="M772 412H802" stroke="url(#sendFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <text x="777" y="398" class="flow-label">Send</text>

  <path d="M1130 412H1160" stroke="url(#unshieldFlow)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowHead)"/>
  <text x="1128" y="398" class="flow-label">Unshield</text>

  <path d="M1310 728C1310 794 1216 824 980 824H280C196 824 146 794 146 742" stroke="url(#unshieldFlow)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="10 12" marker-end="url(#returnHead)"/>
  <text x="1072" y="812" class="flow-label">Return to Public Wallet</text>

  <rect x="86" y="850" width="920" height="96" rx="24" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)"/>
  <text x="116" y="886" class="strip-title">What&apos;s live today</text>
  <text x="116" y="914" class="strip-bullet">- one live asset: VUSD</text>
  <text x="332" y="914" class="strip-bullet">- devnet only</text>
  <text x="476" y="914" class="strip-bullet">- real Shield, Send, and Unshield lifecycle</text>
  <text x="116" y="938" class="strip-bullet">- chain-resolved note state</text>
  <text x="392" y="938" class="strip-bullet">- authenticated operator-backed exit</text>

  <rect x="1030" y="850" width="484" height="96" rx="24" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  <text x="1060" y="886" class="strip-title">What comes later</text>
  <text x="1060" y="914" class="strip-bullet">- stronger privacy semantics</text>
  <text x="1306" y="914" class="strip-bullet">- richer nullifier / proof system</text>
  <text x="1060" y="938" class="strip-bullet">- broader asset support</text>
  <text x="1274" y="938" class="strip-bullet">- future modules: Swap, Pay</text>
</svg>
