<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanta Trading Lab</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a0d;
        --surface: #10151b;
        --surface-2: #151b22;
        --line: rgba(255, 255, 255, 0.12);
        --text: #f4f6f7;
        --muted: #a3adb7;
        --green: #76d6a0;
        --amber: #e8bd65;
        --red: #ef8585;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1160px, 100%);
        margin: 0 auto;
        padding: 22px;
        display: grid;
        gap: 14px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 30px;
      }

      .panel,
      .card {
        border: 1px solid var(--line);
        background: var(--surface);
      }

      .panel {
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
      }

      button {
        min-height: 38px;
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--text);
        padding: 0 12px;
        font: inherit;
      }

      .muted,
      .desc {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 14px;
      }

      .asset-list {
        display: grid;
        gap: 10px;
      }

      .card {
        display: grid;
        grid-template-columns: 90px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
      }

      .symbol,
      .price {
        font-weight: 760;
      }

      .symbol {
        font-size: 20px;
      }

      .pill {
        border: 1px solid var(--line);
        background: var(--surface-2);
        padding: 4px 8px;
        font-size: 12px;
      }

      .green {
        color: var(--green);
      }

      .amber {
        color: var(--amber);
      }

      .red {
        color: var(--red);
      }

      @media (max-width: 840px) {
        main,
        .grid,
        .top,
        .card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel top">
        <div>
          <p class="muted">Standalone product lane</p>
          <h1>Vanta Trading Lab</h1>
          <p class="desc">Live market observations, policy blockers, and setup reviews. No trade execution.</p>
        </div>
        <button id="refresh">Refresh</button>
      </section>

      <section class="grid">
        <div class="panel">
          <h2>Market observations</h2>
          <p class="desc" id="freshness">Loading...</p>
          <div class="asset-list" id="assets"></div>
        </div>
        <aside class="panel">
          <h2>Promotion blockers</h2>
          <div id="blockers" class="asset-list"></div>
        </aside>
      </section>
    </main>

    <script>
      const apiBase = window.TRADING_LAB_API_BASE_URL ?? "http://127.0.0.1:5299";
      const assets = document.getElementById("assets");
      const blockers = document.getElementById("blockers");
      const freshness = document.getElementById("freshness");
      const refresh = document.getElementById("refresh");

      function money(value) {
        if (value === null || value === undefined) return "--";
        return new Intl.NumberFormat("en-US", {
          currency: "USD",
          maximumFractionDigits: value > 1000 ? 0 : 2,
          style: "currency",
        }).format(value);
      }

      function pct(value) {
        if (value === null || value === undefined) return "--";
        return `${value > 0 ? "+" : ""}${value.toFixed(2)}%`;
      }

      function assetName(symbol) {
        return symbol.replace("USDT", "");
      }

      async function load() {
        refresh.disabled = true;
        refresh.textContent = "Refreshing...";
        try {
          const response = await fetch(`${apiBase}/market`, { cache: "no-store" });
          if (!response.ok) throw new Error(await response.text());
          const data = await response.json();
          freshness.textContent = `Refreshed ${new Date(data.freshness.generatedAt).toLocaleString()} from ${data.freshness.providerLabel}.`;
          assets.innerHTML = data.rows
            .map(
              (row) => `
                <button class="card" type="button">
                  <span class="symbol">${assetName(row.symbol)}</span>
                  <span>
                    <span class="price">${money(row.price)}</span>
                    <p class="desc">${row.rangeLabel}. ${row.momentumLabel}. 48h change ${pct(row.history.changePct)}.</p>
                  </span>
                  <span class="pill ${row.dayChangePct > 2 ? "green" : row.dayChangePct < -2 ? "red" : "amber"}">${pct(row.dayChangePct)} 24h</span>
                </button>
              `,
            )
            .join("");
          blockers.innerHTML = data.policyState.blockers
            .map((blocker) => `<div class="card"><span class="pill red">Blocked</span><p class="desc">${blocker}</p></div>`)
            .join("");
        } catch (error) {
          freshness.textContent = "Live data unavailable.";
          assets.innerHTML = `<div class="card"><p class="desc">${error.message}</p></div>`;
        } finally {
          refresh.disabled = false;
          refresh.textContent = "Refresh";
        }
      }

      refresh.addEventListener("click", load);
      load();
    </script>
  </body>
</html>
